services:
  # 1. Database (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"  # เพิ่มบรรทัดนี้ เพื่อให้เครื่อง Notebook มองเห็น Database นี้
    restart: always
    environment:
      POSTGRES_USER: superuser      # Superuser สำหรับแอดมิน (เอาไว้ Backup)
      POSTGRES_PASSWORD: p@sswo=0rd  # รหัสผ่าน Superuser
      POSTGRES_DB: ww_sys
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database-init:/docker-entrypoint-initdb.d # สั่งรันสคริปต์สร้าง App User อัตโนมัติ

  # 2. Backend (Node.js + Express)
  backend:
    build: ./ww-backend
    image: pasakorndev/my-backend:v1.0.0
    restart: always
    env_file:
      - ./ww-backend/.env     
    depends_on:
      - postgres-db

  # 3. Frontend (React + Vite)
  frontend:
    build: ./ww-frontend
    image: pasakorndev/my-frontend:v1.0.0
    restart: always

  # 4. Nginx (Gateway / Reverse Proxy หน้าสุด)
  nginx-gateway:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
