# nginx/default.conf — Gateway สำหรับ Production ที่มี Domain
# แก้ app.example.com / pgadmin.example.com เป็นโดเมนจริง (ทั้งไฟล์: ค้นหา example.com)

limit_req_zone $binary_remote_addr zone=pgadmin_rl:10m rate=20r/s;

# ---------- HTTP (80): ต่ออายุใบรับรอง + redirect ไป HTTPS ----------
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }            # คนยิงด้วย IP / โดเมนที่ไม่รู้จัก → ตัดการเชื่อมต่อ
}
server {
    listen 80;
    server_name app.example.com pgadmin.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS: ปฏิเสธ host ที่ไม่รู้จัก (สแกนด้วย IP) ----------
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---------- เว็บแอปหลัก ----------
server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- pgAdmin (โดเมนย่อยแยก) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name pgadmin.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;   # cert เดียวกัน (มีทั้ง 2 ชื่อ)
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # ไม่ใส่ X-Frame-Options / CSP ซ้ำ — pgAdmin ตั้งของตัวเองแล้ว (SAMEORIGIN) ใส่ DENY จะทำให้บางหน้าพัง

    # ===== ชั้นที่ 1: จำกัด IP (แก้เป็น IP ออกเน็ตของออฟฟิศ/บ้านคุณ แล้วลบบรรทัดที่เป็นตัวอย่าง) =====
    allow 203.0.113.10;        # ← ตัวอย่าง แก้เป็น IP จริง
    # allow 198.51.100.0/24;
    deny  all;

    location / {
        limit_req zone=pgadmin_rl burst=100 nodelay;

        # resolve ชื่อ container ตอนมี request (ไม่ใช่ตอนสตาร์ท) — pgAdmin อยู่ใน profile "admin"
        # ไม่ได้รันตลอด ถ้าใช้ upstream ปกติ nginx จะ "host not found" แล้วสตาร์ทไม่ขึ้น
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pgadmin_upstream http://pgadmin:80;
        proxy_pass $pgadmin_upstream;

        proxy_redirect off;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme          $scheme;   # ตามเอกสาร pgAdmin ให้สร้าง URL เป็น https
        proxy_read_timeout 300s;
    }
}
