# nginx/default.lan.conf — เฟส 1: ใช้งานในวงแลน (HTTP)  → คัดลอกเป็น nginx/default.conf
# เข้าเว็บ:   http://IP-ของ-Server          (พอร์ต 80)
# เข้า pgAdmin: http://IP-ของ-Server:5050   (เฉพาะ IP ในวงแลน)
# ไม่ใส่ HSTS ในเฟสนี้ (กันเบราว์เซอร์จำว่าต้องใช้ https เฉพาะ IP นี้)

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;   # คงพอร์ตไว้ (csrfMiddleware เทียบ Origin กับ Host)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;       # รายงาน PDF/Excel ใช้เวลานาน
        proxy_read_timeout    300s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- pgAdmin (เฉพาะวงแลน) ----------
server {
    listen 5050;
    server_name _;
    server_tokens off;

    allow 192.168.99.0/24;     # วงแลนของคุณ
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny  all;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;     # ← 127.0.0.11
        set $pgadmin_upstream http://pgadmin:80;
        proxy_pass $pgadmin_upstream;

        proxy_redirect off;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme          $scheme;
        proxy_read_timeout 300s;
    }
}