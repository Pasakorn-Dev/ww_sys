# nginx/default.bootstrap.conf — ใช้ "ครั้งแรกเท่านั้น" เพื่อขอใบรับรอง (ยังไม่มี cert จึงเปิด HTTPS ไม่ได้)
# ขั้นตอน: คัดลอกเป็น nginx/default.conf → docker compose up -d nginx-gateway → รัน certbot → สลับเป็น default.conf ตัวจริง
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 "bootstrap ok\n"; add_header Content-Type text/plain; }
}
