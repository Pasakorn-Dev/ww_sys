# frontend/nginx.conf — nginx ตัวเล็กในอิมเมจ frontend (Dockerfile-frontend ต้อง COPY ไฟล์นี้)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;               # ไฟล์ asset ที่ไม่มีต้อง 404 จริง (ไม่ใช่ส่ง index.html)
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;  # React Router
    }
}
